name: Native PS2 EE build

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/native-ee.yml"
      - "assets/icons/**"
      - "tools/nexus_asset_pack.py"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/native-ee.yml"
  workflow_dispatch:

jobs:
  build-ee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build embedded NXA1 icon atlas
        run: |
          python3 tools/nexus_asset_pack.py pack \\
            --icons assets/icons \\
            --output assets/build/NEXUS-ICONS.NXA \\
            --manifest assets/build/nexus-icons.json
      - name: Cross-compile NEXUS.ELF with the PS2DEV toolchain
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ps2dev/ps2dev:latest \
            sh -c 'export PS2DEV=/usr/local/ps2dev; \
                   export PS2SDK=/usr/local/ps2dev/ps2sdk; \
                   export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2SDK/bin:$PATH"; \
                   apk add --no-cache make; \
                   command -v mips64r5900el-ps2-elf-gcc; \
                   make -C src clean && make -C src'
      - name: Upload NEXUS.ELF
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-ELF
          path: src/NEXUS.ELF
          if-no-files-found: error
          retention-days: 30
