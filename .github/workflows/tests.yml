name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host crypto dependency
        run: python -m pip install -r requirements-host.txt
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q nexus_txn tools tests
      - name: Native navigation host test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include \
            src/nexus_navigation.c tests/native/test_navigation.c \
            -o /tmp/nexus_navigation_test
          /tmp/nexus_navigation_test
      - name: Native atlas format regression test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \\
            -Itests/native/stubs -Isrc/include src/nexus_atlas.c tests/native/test_atlas.c \\
            -Wl,--gc-sections -o /tmp/nexus_atlas_test
          /tmp/nexus_atlas_test
      - name: Native shell C syntax check (PS2SDK API stubs)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only \
            -Itests/native/stubs -Isrc/include \
            src/nexus_main.c src/nexus_input.c src/nexus_ui.c src/nexus_renderer.c \
            src/nexus_atlas.c \
            src/nexus_devices.c src/nexus_navigation.c
