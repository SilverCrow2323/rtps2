name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host crypto dependency
        run: python -m pip install -r requirements-host.txt
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q nexus_txn tools tests
