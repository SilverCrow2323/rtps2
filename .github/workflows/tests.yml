name: Host tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host crypto dependency
        run: python -m pip install -r requirements-host.txt
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q nexus_txn tools tests
      - name: PCSX2 launcher shell syntax
        run: |
          bash -n tools/run_nexus_pcsx2.sh
          bash -n tests/test_pcsx2_launcher.sh
      - name: PCSX2 launcher argument and fallback tests
        run: bash tests/test_pcsx2_launcher.sh
      - name: Native navigation host test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include src/nexus_navigation.c tests/native/test_navigation.c -o /tmp/nexus_navigation_test
          /tmp/nexus_navigation_test
      - name: Native game catalog model test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include src/nexus_library.c tests/native/test_library.c -o /tmp/nexus_library_test
          /tmp/nexus_library_test
      - name: Native explicit fileXio adapter test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Itests/native/stubs -Isrc/include \
            src/nexus_library.c src/nexus_library_scan.c src/nexus_filexio.c \
            tests/native/test_filexio_adapter.c -o /tmp/nexus_filexio_test
          /tmp/nexus_filexio_test
      - name: Native read-only game-library scanner test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include src/nexus_library.c src/nexus_library_scan.c tests/native/test_library_scan.c -o /tmp/nexus_library_scan_test
          /tmp/nexus_library_scan_test
      - name: Native cover-cache LRU policy test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include src/nexus_cover_cache_policy.c tests/native/test_cover_cache_policy.c -o /tmp/nexus_cover_cache_policy_test
          /tmp/nexus_cover_cache_policy_test
      - name: Native atlas format and digest regression test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Itests/native/stubs -Isrc/include src/nexus_atlas.c src/nexus_sha256.c tests/native/test_atlas.c -Wl,--gc-sections -o /tmp/nexus_atlas_test
          /tmp/nexus_atlas_test
      - name: Native SHA-256 regression test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc/include src/nexus_sha256.c tests/native/test_sha256.c -o /tmp/nexus_sha256_test
          /tmp/nexus_sha256_test
      - name: Native shell C syntax check (PS2SDK API stubs)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -Itests/native/stubs -Isrc/include src/nexus_main.c src/nexus_input.c src/nexus_ui.c src/nexus_renderer.c src/nexus_atlas.c src/nexus_cover_cache.c src/nexus_cover_cache_policy.c src/nexus_library.c src/nexus_library_scan.c src/nexus_filexio.c src/nexus_sha256.c src/nexus_devices.c src/nexus_navigation.c
